# MOCK ASSUMPTIONS - 12 illustrative numbers for the hackathon demo. None is a company figure.
# "low" is the CONSERVATIVE case (worse for the business case). "high" is the OPTIMISTIC case.
# The base case is used by default. Edit values here or override them in the Assumptions screen.
# Change costs per milestone are fixed in roadmap.json.

assumptions:
  - key: ai_cost_saving_pct
    label: Saving per AI-assisted review (compared with today's cost)
    unit: share
    low: 0.25
    base: 0.35
    high: 0.40
    confidence: low
    rationale: Base equals the goal target. Not observed. Low and high are judgement.

  - key: platform_cost_eur_month
    label: AI platform licence and hosting, per month from the pilot
    unit: EUR/month
    low: 30000
    base: 25000
    high: 20000
    confidence: low
    rationale: Mock licence and hosting cost.

  - key: cost_per_fte_year_eur
    label: Yearly cost of one person (salary plus employer costs)
    unit: EUR/year
    low: 90000
    base: 80000
    high: 72000
    confidence: low
    rationale: Mock average cost for a KYC, data or compliance role. Not company pay data.

  - key: reviews_per_fte_year
    label: Reviews one person handles per year today
    unit: reviews/year
    low: 1800
    base: 2000
    high: 2200
    confidence: low
    rationale: Mock productivity. Used only for the freed-capacity figure.

  - key: backfill_share
    label: Share of a moved person's yearly cost paid to cover their old work
    unit: share
    low: 0.6
    base: 0.5
    high: 0.4
    confidence: low
    rationale: Applies to redeployed and reskilled people. Mock; depends on team workload.

  - key: redeploy_cost_eur
    label: One-off cost to move one person into a new role
    unit: EUR/person
    low: 1500
    base: 1000
    high: 500
    confidence: low
    rationale: Handover and role change. Mock.

  - key: reskill_cost_eur
    label: One-off training cost per reskilled person (course and cover for lost time)
    unit: EUR/person
    low: 4000
    base: 3000
    high: 2000
    confidence: low
    rationale: Mock course and trainer cost.

  - key: reskill_training_months
    label: Training time before a reskilled person starts the new role
    unit: months
    low: 3
    base: 2
    high: 1
    confidence: low
    rationale: Mock. The person does no programme work while training.

  - key: reskill_uplift_eur_year
    label: Yearly pay rise for a reskilled person
    unit: EUR/year
    low: 6000
    base: 4000
    high: 3000
    confidence: low
    rationale: Mock. Only the rise is new cost, because the base salary is already paid.

  - key: hire_cost_eur
    label: One-off cost per new hire (recruitment, onboarding, ramp-up)
    unit: EUR/hire
    low: 25000
    base: 20000
    high: 15000
    confidence: low
    rationale: Mock. Includes recruiter fee, onboarding and mentor time.

  - key: hire_lead_time_months
    label: Months from programme start until a new hire can start
    unit: months
    low: 6
    base: 4
    high: 3
    confidence: low
    rationale: Mock recruiting lead time.

  - key: contractor_day_rate_eur
    label: Contractor day rate (bridge cover, capped at 30% of a need)
    unit: EUR/day
    low: 1000
    base: 900
    high: 800
    confidence: low
    rationale: Mock external rate.
