[project]
name = "strategy-compiler"
version = "0.1.0"
description = "MOCK hackathon demo: CEO goal -> workforce and financial execution plan (Northwind Bank is fictional)."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strategy_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
